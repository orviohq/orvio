name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test --config playwright.renderer.config.ts
      - name: Restore licensed exact-audio test fixture
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python scripts/restore-audio1.py
      - run: node scripts/build-source-flow.mjs
      - name: Source and original-UI integration (mock backend only)
        run: npx playwright test --config playwright.source.config.ts --grep-invert "real origin backend|actual production origin|original UI reads live"
      - run: npx playwright test --config playwright.pwa.config.ts
